# cargo-about configuration. Keep in sync with deny.toml's license allowlist —
# the report lists every crate whose license satisfies one of these identifiers.
# Dual `OR` expressions (e.g. self_cell's "Apache-2.0 OR GPL-2.0-only") pass if
# any alternative is accepted.

accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
  # niri-ipc, and niri-center itself:
  "GPL-3.0-or-later",
]